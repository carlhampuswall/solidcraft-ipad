[package]
name = "solidcore"
description = "B-rep solid modeling kernel: a pure-Rust port of NVIDIA's SMLib (usd-brep v1.0.1), matched against the C++ to 1e-9"
edition = "2021"
license = "Apache-2.0"
# Tracks the upstream SMLib release it is ported from and matched against (usd-brep v1.0.1).
version = "1.0.1"
rust-version = "1.85"
repository = "https://github.com/tangency-labs/solidcore"
readme = "README.md"
keywords = ["cad", "brep", "nurbs", "geometry", "solid-modeling"]
categories = ["graphics", "mathematics", "science"]

[features]
# Kernels start with the curve cache memo off (`Kernel::memoize_curve_caches`), to
# run difftest and the tests in both positions. Results never depend on it.
curve-memo-off = []

[dependencies]
thiserror = "2"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "allow"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Library code must not abort on input-derived data: return SolidError instead.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Eager `ok_or(SolidError::unported(..))` built every error on every call (batch 50b).
or_fun_call = "warn"
# Justified pedantic allows (port fidelity):
# - upstream compares doubles exactly (e.g. against SM_UNDEF_DOUBLE); keep its semantics
float_cmp = "allow"
# - upstream math uses u, v, w, i, j, k, dU, dV ... naming; renaming hurts traceability
many_single_char_names = "allow"
similar_names = "allow"
# - upstream constants are copied digit-for-digit
unreadable_literal = "allow"
excessive_precision = "allow"
# - integer/float conversions are pervasive in ported index/knot arithmetic
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# - ported functions keep upstream structure, which is often long
too_many_lines = "allow"
too_many_arguments = "allow"
# - suggests f64::midpoint, which changes numerics vs upstream (a+b)/2
manual_midpoint = "allow"
# - every fallible fn returns SolidError; a per-fn "# Errors" section is noise
missing_errors_doc = "allow"
# - modules mirror upstream names (nurbs::NurbsCurve etc.)
module_name_repetitions = "allow"
# - thousands of ported getters; #[must_use] is added deliberately where it matters
must_use_candidate = "allow"
