[package]
name = "solidcraft-ipados-bridge"
description = "SolidCraft native Apple host ABI and existing GPU renderer integration"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
neg_cmp_op_on_partial_ord = "allow"

[dependencies]
solidcraft-geom = { workspace = true }
solidcraft-ipados-session = { path = "../session" }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
solidcraft-gpu = { workspace = true }
solidcraft-render = { workspace = true }
wgpu = { workspace = true, features = ["metal"] }
pollster = { workspace = true }
