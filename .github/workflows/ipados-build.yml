name: iPadOS native foundation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ipados-build.yml'
      - 'apps/solidcraft-ipados/**'
      - 'assets/locales/en.json'
      - 'assets/locales/pending/ipados-*.json'
      - 'crates/ipados/**'
      - 'crates/engine/**'
      - 'crates/doc/**'
      - 'crates/geom/**'
      - 'crates/gpu/**'
      - 'crates/io/**'
      - 'crates/kernel/**'
      - 'crates/render/**'
      - 'crates/sketch/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: ipados-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-foundation:
    if: github.repository == 'carlhampuswall/solidcraft-ipad'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, repository pin
      - name: Record Apple SDKs
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
      - name: Select project Rust without changing the global default
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target aarch64-apple-ios --target wasm32-unknown-unknown
          rustup run 1.95.0 rustc --version
      - name: Adapter and ABI tests
        run: cargo +1.95.0 test --locked --profile ci -p solidcraft-ipados-session -p solidcraft-ipados-bridge --lib
      - name: Shared CAD dependency boundary
        run: |
          set -o pipefail
          cargo +1.95.0 metadata --locked --format-version 1 --filter-platform aarch64-apple-ios | python3 crates/ipados/check-dependencies.py
      - name: Formatting and affected Clippy
        run: |
          cargo +1.95.0 fmt --all -- --check
          cargo +1.95.0 clippy --locked --profile ci -p solidcraft-ipados-session -p solidcraft-ipados-bridge --all-targets --no-deps -- -D warnings
      - name: Portable adapter check
        run: cargo +1.95.0 check --locked --profile ci --target wasm32-unknown-unknown -p solidcraft-ipados-session -p solidcraft-ipados-bridge --lib
      - name: Unsigned iPad device application build
        run: sh apps/solidcraft-ipados/scripts/build.sh
      - name: Verification limits
        if: always()
        run: |
          echo '### iPadOS foundation' >> "$GITHUB_STEP_SUMMARY"
          echo 'This job tests the adapter/ABI and builds an unsigned native device app. It does not launch an application, boot a simulator, verify Pencil, install on an iPad, or replace the complete upstream CI gate.' >> "$GITHUB_STEP_SUMMARY"
